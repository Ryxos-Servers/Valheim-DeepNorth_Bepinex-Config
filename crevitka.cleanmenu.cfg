## Settings file was created by plugin Clean Main Menu v1.2.0
## Plugin GUID: crevitka.cleanmenu

[Advanced]

## Re-apply cleanup whenever a menu scene loads (fixes UI coming back after exiting a world).
# Setting type: Boolean
# Default value: true
Reapply on menu scene load = true

## While in the menu, keep re-applying cleanup periodically (handles UI being recreated later).
# Setting type: Boolean
# Default value: true
Watch menu continuously = true

## How often to re-apply cleanup while watching the menu.
# Setting type: Single
# Default value: 1
Watch interval (seconds) = 1

[General]

## Hide the 'modded' warning text in main menu (object name: modded_text).
# Setting type: Boolean
# Default value: true
Hide modded_text = true

## Hide 'showlog' button in main menu (object name: showlog).
# Setting type: Boolean
# Default value: true
Hide showlog button = true

## Hide top-right panel (usually merch store / icons) (object name: TopRight).
# Setting type: Boolean
# Default value: true
Hide TopRight (Merch) = true

## Hide the changelog panel and its 'new changes' notice (Valheim 1.0+: FejdStartup.m_changeLog / m_changeLogNotice; older: Canvas Changelog).
# Setting type: Boolean
# Default value: true
Hide Changelog = true

## Hide the 'Show changelog' button added in Valheim 1.0 (FejdStartup.m_showChangelogButton). If you keep the button, the changelog is only hidden once on menu load so you can still open it manually.
# Setting type: Boolean
# Default value: true
Hide Changelog button = true

## Hide the 'EULA' (user agreement) button in the main menu (FejdStartup.m_showEulaButton). The game still shows the agreement window automatically when it is required.
# Setting type: Boolean
# Default value: true
Hide EULA button = true

## Hide Version Number (object name: version_text).
# Setting type: Boolean
# Default value: true
Hide Version Number = true

[Timing]

## Wait before first attempt (menu UI may spawn a bit later).
# Setting type: Single
# Default value: 1.5
Initial delay (seconds) = 1.5

## How many times to try hiding (useful when UI spawns late or gets recreated).
# Setting type: Int32
# Default value: 10
Attempts = 10

## Delay between attempts.
# Setting type: Single
# Default value: 1
Interval between attempts (seconds) = 1

