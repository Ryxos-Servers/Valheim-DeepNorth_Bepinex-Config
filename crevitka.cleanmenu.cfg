## Settings file was created by plugin Clean Main Menu v1.1.0
## Plugin GUID: crevitka.cleanmenu

[Advanced]

## Re-apply cleanup whenever a menu scene loads (fixes UI coming back after exiting a world).
# Setting type: Boolean
# Default value: true
Reapply on menu scene load = true

## While in the menu, keep re-applying cleanup periodically (handles UI being recreated later).
# Setting type: Boolean
# Default value: true
Watch menu continuously = true

## How often to re-apply cleanup while watching the menu.
# Setting type: Single
# Default value: 1
Watch interval (seconds) = 1

[General]

## Hide the 'modded' warning text in main menu (object name: modded_text).
# Setting type: Boolean
# Default value: true
Hide modded_text = true

## Hide 'showlog' button in main menu (object name: showlog).
# Setting type: Boolean
# Default value: true
Hide showlog button = true

## Hide top-right panel (usually merch store / icons) (object name: TopRight).
# Setting type: Boolean
# Default value: true
Hide TopRight (Merch) = true

## Hide left-side changelog panel (object name: Canvas Changelog).
# Setting type: Boolean
# Default value: true
Hide Changelog = true

## Hide Version Number (object name: version_text).
# Setting type: Boolean
# Default value: true
Hide Version Number = false

[Timing]

## Wait before first attempt (menu UI may spawn a bit later).
# Setting type: Single
# Default value: 1.5
Initial delay (seconds) = 1.5

## How many times to try hiding (useful when UI spawns late or gets recreated).
# Setting type: Int32
# Default value: 10
Attempts = 10

## Delay between attempts.
# Setting type: Single
# Default value: 1
Interval between attempts (seconds) = 1

