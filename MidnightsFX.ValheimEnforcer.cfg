[Audit]

## Master switch for the player activity audit, and the only switch it has: the audit records all three of the things below, or it records nothing. When enabled, the server writes three things to BepInEx/config/ValheimEnforcer/Audit, one file per day, deleted once they pass AuditRetentionDays. (1) Items gained and lost, read from the character delta stream the server already receives, so it costs nothing extra - but it inherits that stream's shape: the client coalesces changes over a couple of seconds before sending them, so a timestamp is when the server heard about it rather than when it happened, and it is a NET diff, so picking something up and dropping it again within one window produces no entry at all. It is also the one part that is client-reported. (2) What players take out of and put into chests, ships, carts and graves, read from the container's own world data rather than from any message the client sends, so it catches every route in - taking, storing, Take All, and a modified client writing the item list directly - and cannot be avoided by a client that stays quiet. Items are matched by prefab and quality with stacks summed, so tidying a chest is not reported as a flurry of takes. Graves are containers too, so this also records somebody looting a grave that is not theirs. (3) How much damage each player is dealing, and the spikes. The figure is the PRE-MITIGATION damage the attacking client claimed, before the victim applies armour, resistances and difficulty scaling - the right number for spotting the impossible, the wrong number for comparing builds. Only hits from a player's own character count; damage from their tamed creatures does not. When GuardDamageRpc is also on the damage message is read once and used for both, so running the two together is cheaper than it looks. This records and reports only - it never kicks, bans, confiscates or blocks anything, and it is not a detector. ON by default, which means a server that installs this mod and changes nothing is keeping a log of what its players do on disk. That is the point of the feature and it is why the default is on - an audit you have to have known to switch on beforehand is no use on the day you need it - but it is a decision to make deliberately, and to tell your players about if that is how you run your server. Set this to false to record nothing. Turning it OFF takes effect immediately; turning it back ON takes a server restart, because the container half has to watch every object a client replicates and its hook is only installed at startup.
# Setting type: Boolean
# Default value: true
EnableAuditLog = true

## How many days of history to keep. Older day-files are deleted, one file per pass every five minutes, so a server that has been offline for a month drains its backlog gradually instead of stalling on a single large sweep. Anything an admin has downloaded with enforcer-audit-download is their own copy and is not covered by this.
# Setting type: Int32
# Default value: 7
# Acceptable value range: From 1 to 90
AuditRetentionDays = 7

## Seconds between writes of buffered events to disk. Writing happens on a background thread, so this trades how much is held in memory against how much a hard crash could lose - a clean shutdown always flushes first, and a report always reads the buffer as well as the files, so this never affects what a command shows you.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 600
AuditFlushIntervalSeconds = 30

## Length of the rolling window enforcer-audit-damage reports over, in seconds. The default of one minute is long enough to show a sustained rate and short enough that a fight from ten minutes ago is not still in the numbers. Requires EnableAuditLog.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 10 to 600
AuditDamageWindowSeconds = 60

## Damage on a SINGLE hit above which an entry is written to the audit log. Deliberately far below MaxAllowedHitDamage: that setting drops packets carrying impossible numbers, while this one only notes hits that are merely suspicious, which is the range a careful cheater actually operates in. Expect legitimate late-game hits to reach this; it is a thing to look at, not an accusation. Requires EnableAuditLog.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 1 to 1000000
AuditHighDamageThreshold = 200

## Total damage across one window above which an entry is written, for the case that matters more than any single hit: a stream of individually plausible hits arriving far faster than a player can swing. At most one entry per player per window either way, so a long boss fight cannot flood the log. Requires EnableAuditLog.
# Setting type: Single
# Default value: 5000
# Acceptable value range: From 1 to 1E+07
AuditHighDamagePerWindow = 5000

## How many containers the server remembers the previous contents of at once, so it can tell what changed. Beyond this the least recently touched are forgotten; a forgotten container is not lost from the audit, but the first change after it is forgotten re-establishes a baseline instead of being recorded. Raise it on a server with a very large number of chests in active use. Requires EnableAuditLog.
# Setting type: Int32
# Default value: 5000
# Acceptable value range: From 64 to 200000
AuditContainerTrackingLimit = 5000

## Largest number of days one enforcer-audit-download request may ask for. A request for more is clamped to this rather than refused, so an admin asking for everything gets everything there is.
# Setting type: Int32
# Default value: 7
# Acceptable value range: From 1 to 90
AuditMaxDownloadDays = 7

## Whether anyone on the server's adminlist is left out of the audit. OFF by default, unlike every other admin exemption in this mod - and the difference is deliberate. The other exemptions exist because those features punish, and an admin using devcommands should not be kicked for it. This feature only records, so exempting admins buys nothing and puts a blind spot in exactly the accounts that can do the most damage and are the most worth impersonating. Turn it on only if you have a specific reason to stop recording your own staff.
# Setting type: Boolean
# Default value: false
AuditExemptAdmins = false

[Backups]

## Master switch for keeping rolling, compressed archives of this server's world save together with its character saves. The game already rotates backups of its own - two of them, uncompressed, of the world only - so what this adds is a longer history, compression, and the character store in the same archive. That last part is the reason it exists: restoring one of the game's backups puts the world back and leaves every character exactly as they were, which is its own kind of rollback. Be aware of the cost before switching it on. A real world file reaches 200 megabytes, the game's own rotation already keeps around a gigabyte beside it, and each archive here is another copy of that on top - compressed, but still measured in hundreds of megabytes. Archives are written after a world save finishes, never during one, so an archive is always of a complete save. Off by default; every part of the feature is inert until this is on.
# Setting type: Boolean
# Default value: false
EnableSaveArchives = false

## The shortest gap, in minutes, between two archives. An archive is only ever taken just after a world save completes, so the real cadence is this rounded up to the next save; a value below the server's own save interval simply means every save. enforcer-archive-now ignores this for one archive.
# Setting type: Int32
# Default value: 120
# Acceptable value range: From 5 to 1440
SaveArchiveIntervalMinutes = 120

## How many archives to keep. The oldest beyond this are deleted right after a new one is written, and lowering it takes effect at the next archive rather than one file at a time - this is a setting about disk space, so it has to give the disk back when you ask.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 100
SaveArchiveKeepCount = 5

## A ceiling, in megabytes, on what all archives together may occupy. Oldest first are deleted until the total fits. 0 means no ceiling, and SaveArchiveKeepCount alone decides. The newest archive is never deleted to satisfy this, so setting it below the size of a single archive keeps one rather than none.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 1000000
SaveArchiveMaxTotalMB = 0

## Whether to include the Characters folder - every player's items, skills, confiscation record and, if it is on, their synced progression. On by default, because a world restored without it is a world where everybody's character is from a different moment in time.
# Setting type: Boolean
# Default value: true
SaveArchiveIncludeCharacters = true

## Whether to include this mod's own configuration: the .cfg and the YAML files beside it (Mods.yaml, Notifications.yaml, KnownCheaters.yaml, PlayerIds.yaml). Small, and it is what makes an archive enough to rebuild a server from. Other mods' configuration is deliberately not included - it is not this mod's to copy around.
# Setting type: Boolean
# Default value: true
SaveArchiveIncludeConfig = true

## How hard to compress. 'Fastest' is the default and the right answer for a world file, which is already dense; 'Optimal' buys a little more at a large cost in CPU time on a file this size; 'NoCompression' just packs the files together. The work happens on a background thread either way, so this trades disk against a background core rather than against frame time.
# Setting type: String
# Default value: Fastest
# Acceptable values: Fastest, Optimal, NoCompression
SaveArchiveCompression = Fastest

## Where archives are written. Empty means BepInEx/config/ValheimEnforcer/Archives. Point it at another drive if you would rather not keep a second copy of the world on the same one that holds the first.
# Setting type: String
# Default value: 
SaveArchivePath = 

[Client config]

## Enables Debug logging.
# Setting type: Boolean
# Default value: false
EnableDebugMode = false

## Colour the output of this mod's console commands by severity - green for a result, blue for detail lines, amber for a warning, red for a failure. Turn it off if your console theme makes the colours hard to read, or if you are copying output somewhere that would show the markup.
# Setting type: Boolean
# Default value: true
EnableTerminalColors = true

[Crash Recovery]

## Master switch for emergency crash recovery. Every few minutes the server hands each connected player a sealed snapshot of their own character - encrypted and signed with a key that never leaves the server, so it is opaque to whoever is holding it and useless anywhere else. If this server then crashes and comes back from an older save, it asks for those snapshots back and adopts the ones that verify and are genuinely newer than what it holds. Understand the trade before switching it on. The world and the character store are separate saves and roll back independently, so restoring a character to a state newer than the world can re-introduce items whose source in the world - the chest they came out of, the vein they were mined from - has itself rolled back. That is item duplication, and it is inherent to putting a character back rather than a fault in how it is done. It is also why restoration only ever happens inside a narrow window after an unclean shutdown. Note what this is not: the client cannot read its own snapshot, so this is no help against a lost or corrupted LOCAL character file - EnableProgressionSync is what covers that direction. Off by default; every part of the feature is inert until this is on.
# Setting type: Boolean
# Default value: false
EnableCrashRecovery = false

## Whether a verified, newer snapshot is adopted on its own while the recovery window is open, or whether the window only reports what could be restored. On by default, because the window is already narrow and only opens after an unclean shutdown - but it is a separate switch from EnableCrashRecovery so an admin can have the snapshots kept and distributed without the server ever acting on one unasked. With this off, nothing a client hands back is ever applied.
# Setting type: Boolean
# Default value: true
CrashRecoveryAutoRestore = true

## How long after an unclean shutdown the server keeps accepting snapshots. The window opens only when the previous run left no clean-shutdown marker, and closes on its own after this many minutes; an admin can open one by hand with enforcer-recovery-open for a rollback the server could not have noticed, such as a restore from a backup.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 720
CrashRecoveryWindowMinutes = 30

## How often each connected player is sent a fresh snapshot. This is the bound on how much can be lost: a crash costs at most whatever happened since a player's last snapshot. It is also the bandwidth knob - a snapshot is a compressed character save, tens to hundreds of kilobytes, sent per player per interval - so a busy server should think about this number rather than only about the smallest one.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 120
CrashRecoveryPushIntervalMinutes = 10

## How many characters' snapshots a client keeps per world. One file per character, each replaced by a newer one rather than accumulating, so this bounds how many different characters are remembered rather than how many copies of one.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 20
CrashRecoveryKeepBlobs = 3

[Discord]

## Discord webhook URL the server posts notifications to. This is a server-only secret and is never synced to clients. Leave empty to disable. Note: player names are sent to Discord when enabled. Every category falls back to this URL unless it has one of its own, so a server that wants everything in one channel only needs this setting.
# Setting type: String
# Default value: 
WebhookUrl = 

## Webhook URL for player joins and leaves. Leave empty to use WebhookUrl. Set this to keep routine join/leave traffic out of the channel you actually watch - it is by far the noisiest category on a busy server.
# Setting type: String
# Default value: 
WebhookUrlPlayerActivity = 

## Webhook URL for server startup, shutdown and world-save messages. Leave empty to use WebhookUrl.
# Setting type: String
# Default value: 
WebhookUrlServerStatus = 

## Webhook URL for cheat bans and character-limit rejections. Leave empty to use WebhookUrl. This is the one worth pointing at a private moderator channel: the messages name the account behind a ban.
# Setting type: String
# Default value: 
WebhookUrlModeration = 

## Webhook URL for connections refused over a mod mismatch. Leave empty to use WebhookUrl. Often worth a support channel of its own, since the message lists exactly which mods the player needs to fix.
# Setting type: String
# Default value: 
WebhookUrlModMismatch = 

## Name for this server in notification messages, available to templates as the {server} placeholder. Empty by default, and no built-in template uses it - set it only if several servers post into the same channel and you need to tell them apart. Deliberately a setting rather than the server's advertised name, so it also works on a player-hosted world.
# Setting type: String
# Default value: 
ServerLabel = 

## Post a message when the server comes online.
# Setting type: Boolean
# Default value: true
NotifyServerStartup = true

## Post a message when the server shuts down.
# Setting type: Boolean
# Default value: true
NotifyServerShutdown = true

## Post a message every time the world is saved, covering both the periodic autosave and a manual 'save' from the console. Off by default because the autosave fires roughly every twenty minutes, all day, whether or not anyone is playing - on most servers that buries everything else in the channel. Worth turning on temporarily when you are chasing a save problem, or permanently if it has its own channel via WebhookUrlServerStatus.
# Setting type: Boolean
# Default value: false
NotifyWorldSaved = false

## Post a message when a player joins.
# Setting type: Boolean
# Default value: true
NotifyPlayerJoined = true

## Post a message when a player leaves, including whether their saved data is up to date.
# Setting type: Boolean
# Default value: true
NotifyPlayerLeft = true

## Post a message when a player is rejected for a mod mismatch, listing the offending mods.
# Setting type: Boolean
# Default value: true
NotifyWrongMods = true

## Post a message when a player is banned for cheat usage, including the detected cheat(s).
# Setting type: Boolean
# Default value: true
NotifyCheaterBanned = true

## Post a message when a connection is refused by EnforceCharacterLimit, naming the character that was turned away.
# Setting type: Boolean
# Default value: true
NotifyCharacterRejected = true

## Post a message when a player gains equipment that has no crafter, or one no player here has ever reported. Inert unless DetectItemOrigins is on. One post per player per minute at most, however many items were involved - a cheat tool hands over a whole loadout at once, and a message per item would walk the webhook straight into Discord's rate limiter.
# Setting type: Boolean
# Default value: true
NotifyItemOrigin = true

## Post to the moderation channel when a client shows signs of anti-cheat tampering: a patched or detached cheat detector, a scan that stopped, or reports that never arrived. Medium confidence - nobody is kicked or banned for these alone. Inert unless DetectAntiCheatTampering or CheatScanHeartbeat is on.
# Setting type: Boolean
# Default value: true
NotifyCheatSuspected = true

## Post to the moderation channel when a connected player trips a server-side guard, naming what they declared at join. Inert unless ReportClientContradictions is on. One post per player per guard - a repeat of the same guard is not posted again, so a player hammering one of them cannot walk the webhook into Discord's rate limiter.
# Setting type: Boolean
# Default value: true
NotifyClientContradiction = true

## Post a message when structure validation catches a player placing something no legitimate client can place, naming the prefab and where it landed. Inert unless EnableStructureValidation is on. One post per player per minute at most, however many objects were involved - a cheat tool drops a whole village at once, and a message per piece would walk the webhook straight into Discord's rate limiter.
# Setting type: Boolean
# Default value: true
NotifyStructureFlagged = true

[Migration]

## If enabled, the server imports character saves from the ServerCharacters mod once at startup, so players migrating from it keep their inventory and skills instead of having everything confiscated on their first join. Characters that already have a save here are left alone, so the pass is safe to leave on. IMPORTANT: uninstall ServerCharacters first - the two mods are declared incompatible and BepInEx will refuse to load ValheimEnforcer while both are present. The files ServerCharacters leaves behind in the character folder are what gets read; nothing is moved or deleted. Off by default.
# Setting type: Boolean
# Default value: false
ImportServerCharacters = false

## Where to look for ServerCharacters' character files. Leave empty to use the game's own local character folder, which is where ServerCharacters puts them and which follows Valheim's -savedir argument automatically. Only set this if you moved the files somewhere else.
# Setting type: String
# Default value: 
ServerCharactersImportPath = 

[Mods]

## Whether or not the mod configuration file will update its loaded mods once they are detected.
# Setting type: Boolean
# Default value: true
UpdateLoadedModsOnStartup = true

## If true, automatically adds mods not found in the optional, admin, or server-only mod lists.
# Setting type: Boolean
# Default value: true
AutoAddModsToRequired = true

## If enabled, any mod in requiredMods that this server does not have loaded is removed from the list at startup, so a mod taken off the server stops being demanded of every client without anyone editing Mods.yaml. Only requiredMods is touched: optionalMods, adminOnlyMods and serverOnlyMods routinely hold mods the server never runs, and are left alone. This also removes a mod you required by hand that the server does not run itself, including one pinned with a thunderstorePackage - put 'keepWhenUnloaded: true' on those entries and they are left alone without having to turn this off for every other mod. Needs UpdateLoadedModsOnStartup for the removal to reach disk. On by default.
# Setting type: Boolean
# Default value: true
RemoveUnloadedModsFromRequired = true

## If enabled, anyone on the server's adminlist may connect with any mods at all - missing required mods, mods this server does not allow, mismatched versions, modified mod files, unlisted BepInEx patchers, and a missing or wrong attestation. It also covers an admin running no ValheimEnforcer at all, who is otherwise refused for never sending a mod list. The check still runs and its result is still written to the server log, so you can see what your admin was carrying; only the rejection is skipped, and the Discord mod-mismatch notification is not sent for them. This exists so you can test a mod against the live server without editing Mods.yaml first. OFF by default, and be deliberate about turning it on: it makes a place on adminlist.txt the only thing between an account and the entire mod gate, so every admin id in that file needs to be somebody you would trust with an arbitrary client. Admin status is read from the server's own admin list against the connection the request arrived on, so no client can claim it.
# Setting type: Boolean
# Default value: false
ModValidationExemptAdmins = false

## Controls SHA256 file verification of client plugin DLLs during the connect handshake, which catches a mod somebody recompiled with different numbers in it even though its version string is unchanged. 'Off' never checks. 'WhenKnown' (the default) enforces only the mods this server has a recorded hash for, so verification is opt-in per mod and enabling it breaks nothing. 'Strict' additionally rejects any client carrying a Required or AdminOnly mod the server has NO recorded hash for - a deliberately loud signal that the mod list is not fully pinned. Individual mods override this with a 'hashEnforcement' field in Mods.yaml. Note this raises the bar from 'edit one file and rebuild' to 'reverse engineer and patch the enforcer'; it is not a wall.
# Setting type: String
# Default value: WhenKnown
# Acceptable values: Off, WhenKnown, Strict
HashEnforcement = WhenKnown

## Make each client prove its mod report was generated for THIS connection. The server hands every connection a random value during the handshake and the client returns a digest over that value and the exact mod and patcher list it is sending; the server recomputes it and compares. Without this, a client reports the same list and the same file hashes every session forever, so a client patched to skip the work can replay one captured answer indefinitely. Be clear on what a pass means: it proves the report was produced now, by code that actually ran - it does NOT prove the report is true, because a client that keeps the original DLLs and hashes those still passes. What it costs an attacker is the difference between returning a constant and keeping a working hashing path alive. Off does nothing at all. Report (the default) logs a failure and lets the player in. Require rejects them - and note that a player on an older ValheimEnforcer sends no attestation at all and is therefore rejected too, so only set Require once your pack has rolled out.
# Setting type: String
# Default value: Report
# Acceptable values: Off, Report, Require
AttestationPolicy = Report

## Hold clients to a list of allowed BepInEx patchers, the same way they are held to a list of allowed mods. Patchers are the DLLs in BepInEx/patchers - not plugins. BepInEx loads them before any plugin exists and hands each one the game assemblies to rewrite on the way in, which is a more powerful position than any plugin has, and until now nothing here looked at that folder at all. The list is an allowlist, not a required list: a client with no patchers always passes, and only a patcher the server has not allowed is refused. Off by default. Patchers are enumerated and logged either way, so leave this off for a while first and read the log to see what your players actually carry.
# Setting type: Boolean
# Default value: false
ValidatePatchers = false

## Adds the patchers this server itself has to the allowedPatchers list in Mods.yaml at startup, with their file hashes, so a server running patchers of its own does not have to write them out by hand. Mirrors AutoAddModsToRequired. Hashes are only ever added, never replaced, so an entry an admin pinned by hand survives. Turn it off to curate the list yourself - patchers the server runs are then refused for clients like any other.
# Setting type: Boolean
# Default value: true
AutoAddPatchersToAllowed = true

## If enabled, the SHA256 of every plugin DLL loaded on this machine is recorded into Mods.yaml at startup, so the mods the server itself runs get pinned with no manual work. Hashes an admin pinned by hand, or that came from a thunderstorePackage, are never overwritten. Requires UpdateLoadedModsOnStartup for the result to reach disk.
# Setting type: Boolean
# Default value: true
RecordHashesForLoadedMods = true

## If enabled, the server downloads any mod in Mods.yaml carrying a 'thunderstorePackage' field (format Owner-ModName or Owner-ModName-Version, the same format a Thunderstore manifest uses), hashes the DLLs inside the archive in memory, records them, and discards the download. This is how you pin a client-only mod the server never loads itself. Only thunderstore.io and its CDN are ever contacted; arbitrary download URLs are deliberately not supported. Off by default because it makes outbound network requests.
# Setting type: Boolean
# Default value: false
ResolveThunderstoreHashes = false

[Network Integrity]

## Master switch for server-side validation of the vanilla routed RPCs a client can send. Valheim relays these without checking anything about who sent them or what they contain, so one modified client can teleport everybody into the ocean, delete a base, impersonate an admin in chat or one-shot another player. Each guard below inspects the packet on the server, where a client cannot lie about it, and drops the ones no legitimate client produces. Off by default; every guard is inert until this is on.
# Setting type: Boolean
# Default value: false
EnableRpcGuards = false

## Replace the display name on every relayed chat message with the name the SERVER holds for that connection. Valheim carries the sender's name inside the chat payload, written by the sending client and never checked, so any client can speak as any player or as an admin - a documented feature of the cheat tools in circulation. This rewrites the name rather than dropping the message, so an honest player never notices and an impersonator simply appears under their own name. No false positives are possible. Requires EnableRpcGuards.
# Setting type: Boolean
# Default value: true
GuardChatSenderName = true

## Refuse the RPC_TeleportPlayer message from non-admin clients. It teleports whoever RECEIVES it, and a client may address it to everybody at once, so it is the cheapest way to relocate a whole server into the ocean or the Ashlands. Vanilla sends it from exactly one place - the admin-only 'recall' console command - so an admin using recall still works while everyone else is refused. Honours RpcGuardExemptAdmins. Requires EnableRpcGuards.
# Setting type: Boolean
# Default value: true
GuardPlayerTeleportRpc = true

## Filter the DestroyZDO message, which names a list of world objects for the server to delete and is checked for nothing at all - not ownership, not distance, not count. Vanilla only ever sends it for objects the sending client owns, so this drops the ids a client neither owns nor is standing near, and lets the rest through. Objects the SERVER destroys are never filtered. The packet is filtered rather than dropped whole, so one bad id cannot cancel a legitimate batch. Requires EnableRpcGuards.
# Setting type: Boolean
# Default value: true
GuardZdoDestruction = true

## Largest number of objects one client may ask the server to delete in a single DestroyZDO message. Ids beyond this are discarded and the sender is reported. Vanilla batches a client's destroys per frame, so legitimate packets are small even when a large structure collapses; the default leaves generous headroom. Requires GuardZdoDestruction.
# Setting type: Int32
# Default value: 512
# Acceptable value range: From 8 to 100000
MaxZdoDestroysPerPacket = 512

## How far from a client's last known position an object may be for that client to be allowed to destroy it, when the server does not have the client recorded as its owner. Ownership is the primary test and covers the normal case; this is the tolerance for the window where a client has taken ownership of something and the server has not caught up. A zone is 64 metres, so the default is a little over one zone. Requires GuardZdoDestruction.
# Setting type: Single
# Default value: 96
# Acceptable value range: From 16 to 10000
ZdoDestroyProximityMetres = 96

## Drop relayed damage messages carrying impossible values. Damage in Valheim is applied by the victim's own client from numbers the ATTACKER's client wrote, and nothing checks them, so a modified client can send any figure it likes at any player or creature. This rejects NaN, infinity, negative components and totals above MaxAllowedHitDamage. It is a sanity bound, not a damage model: it stops one-shot kills and health-bar corruption, it does not try to work out whether a plausible hit was earned. Requires EnableRpcGuards.
# Setting type: Boolean
# Default value: true
GuardDamageRpc = true

## Largest total damage a single relayed hit may carry before it is dropped as impossible. The total is the sum of every damage component in the hit, before the receiver applies resistances and multipliers. Vanilla's heaviest hits land in the low hundreds, so the default is roughly an order of magnitude of headroom for modded weapons, damage-multiplier mods and world modifiers. Raise it if a mod on your server legitimately deals more; lower it only after watching the log. Requires GuardDamageRpc.
# Setting type: Single
# Default value: 5000
# Acceptable value range: From 100 to 1000000
MaxAllowedHitDamage = 5000

## Refuse player-to-player damage on the server when the victim has PvP switched off. Vanilla already refuses this on the victim's own client, but the check is skipped whenever the attacker sets the hit's ignore-PvP flag - and that flag is written by the attacker, so a modified client sets it and kills anybody it likes. This re-runs the decision on the server, where the flag carries no weight. Self-damage is always allowed: a player standing in their own area effect is the one case vanilla sets that flag for legitimately. Off by default even with the other guards on, because a few area-effect prefabs set the flag on purpose and a PvP arena mod may rely on it - watch the log before switching it on. Requires GuardDamageRpc.
# Setting type: Boolean
# Default value: false
GuardPvpDamage = false

## Restrict which global keys a client may set. Global keys hold world progression and the world modifiers - which bosses are dead, whether building costs resources, the damage rates - and any client can set or clear any of them with one message. The allowed set is worked out from the loaded prefabs, so every boss, offering bowl, trader and vegvisir that legitimately sets a key is covered automatically, modded content included; AllowedClientGlobalKeys adds anything the scan cannot see. Off by default even when EnableRpcGuards is on, because a key wrongly refused here silently stops progression registering - turn it on deliberately, watch the log for refusals, and add what you find to the allowlist. Keys the server sets itself are never filtered, and nothing is filtered until the prefab scan has succeeded.
# Setting type: Boolean
# Default value: false
GuardGlobalKeys = false

## Refuse global key REMOVAL from non-admin clients outright, rather than checking it against the allowlist. Nothing in vanilla gameplay removes a global key - only console commands and world setup do - so a client asking to remove one is asking to erase progression or switch off a world modifier. Honours RpcGuardExemptAdmins. Requires GuardGlobalKeys.
# Setting type: Boolean
# Default value: true
BlockClientGlobalKeyRemoval = true

## Comma-separated list of extra global keys clients may set, on top of the ones worked out from the loaded prefabs. Matched on the key name only, so an entry covers the valued form too ('activeBosses' also permits 'activeBosses 2'). Empty by default. Use this when the log shows a legitimate key being refused - a mod that sets a key from code rather than from a prefab field is the usual reason. Requires GuardGlobalKeys.
# Setting type: String
# Default value: 
AllowedClientGlobalKeys = 

## Whether anyone on the server's adminlist is exempt from the RPC guards. On by default, matching StructureValidationExemptAdmins: admins legitimately teleport players with 'recall', set keys, and clean up objects they do not own, and none of that should require noticing this feature exists. The chat name binding is NOT covered by this exemption - it applies to everyone, because an admin has no reason to speak under another player's name. Turn this off to hold admins to the same rules as everyone else.
# Setting type: Boolean
# Default value: true
RpcGuardExemptAdmins = true

## Correlate what a client declared at join with what the guards later catch it doing. Every player who gets past the join gate is running only mods this server approved, so when a server-authoritative guard refuses something they sent, an approved mod set produced traffic the server does not sanction - and the guard is the half of that which cannot be forged. The report names the player, the guard and the mod list they claimed at join, which is what makes it actionable. It deliberately does NOT decide who lied: a guard trip cannot tell a client that lied about its mods apart from an approved mod that legitimately sends this, and nothing can work that out in general. Where the inference IS tight - the client declared only mods the server itself requires, and the server offers no optional mods - the report says so explicitly. Requires EnableRpcGuards for the RPC guards, and EnableStructureValidation for the structure half.
# Setting type: Boolean
# Default value: false
ReportClientContradictions = false

## How many DISTINCT guards one player must trip in a session before ContradictionAction applies. Distinct rather than total on purpose: one player hitting the same guard four hundred times is a single behaviour the guard already stopped, while tripping the teleport, global-key and object-destroy guards once each is a toolkit. Every trip is reported regardless of this number; it only gates the action.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 20
ContradictionThreshold = 2

## What happens to a player who reaches ContradictionThreshold. Separate from RpcGuardAction on purpose, so a server can leave the individual guards on Log - blocking the packet and saying so - while still treating the pattern of several different guards from one player as something to act on. Applied at most once per connection.
# Setting type: String
# Default value: Log
# Acceptable values: Log, Kick, Ban
ContradictionAction = Log

## What happens to a player whose packet a guard refused. The packet is always dropped or corrected and always written to the server log regardless of this setting; this only decides whether the player is also kicked or banned. Defaults to Log so a server can watch the guards for a while before letting them remove anybody - do that first, because a mod doing something unusual shows up here as a refusal.
# Setting type: String
# Default value: Log
# Acceptable values: Log, Kick, Ban
RpcGuardAction = Log

[Player Sync]

## If enabled, any items that are not tracked by the server will be removed from joining player's inventories.
# Setting type: Boolean
# Default value: true
RemoveNontrackedItemsFromJoiningPlayers = true

## If enabled, any items the player does not have that are listed on the server will be given to the player when joining
# Setting type: Boolean
# Default value: true
AddMissingItemsFromPlayerServerSave = true

## If enabled, a returning character whose skills are below the levels the server holds for them has them raised back to those levels when they join - the skill counterpart of AddMissingItemsFromPlayerServerSave. This is what brings a character back after its local save was deleted and the character recreated under the same name: the server still holds their progress, and without this the recreated character's blank skills would be uploaded as the new record on their first save. Never lowers a skill; PreventExternalSkillRaises covers the other direction. Skipped on a dirty reconnect unless ItemReturnForDirtyReconnection is on, for the same reason item restoration is: the stored copy can be a delta window stale, and the one way it can hold a higher skill than the player has is a death the server never heard about. On by default.
# Setting type: Boolean
# Default value: true
RestoreSkillsFromPlayerServerSave = true

## If enabled, player skill gains outside of the server are removed when connecting.
# Setting type: Boolean
# Default value: true
PreventExternalSkillRaises = true

## If enabled, new characters that have no existing character file will have all items removed except for starting items.
# Setting type: Boolean
# Default value: false
NewCharactersRemoveExtraItems = false

## If enabled, new characters will have their skills set to zero. Prevents players from raising skills before connecting.
# Setting type: Boolean
# Default value: false
NewCharacterSetSkillsToZero = false

## If enabled, tracks player custom data. Warning: custom data can be large and can impact how other mods function.
# Setting type: Boolean
# Default value: true
PreventExternalCustomDataChanges = true

## If enabled, new characters will have their custom data cleared.
# Setting type: Boolean
# Default value: true
newCharacterClearCustomData = true

## Leaves inventory-describing custom data owned by slot mods (ExtraSlots and its CustomSlots addon, EquipmentAndQuickSlots including its 2.x legacy keys, InventorySlots) to those mods instead of tracking and enforcing it. These mods keep a serialized backup of every slot item in player custom data and restore those items whenever a character loads with empty slots; when the enforcer tracked that backup and re-applied its (stale) copy on every spawn, each death resurrected and duplicated the player's slot gear. With this enabled the affected keys are never stored in server saves, never streamed as deltas, and never overwrite the live player's own value, and the mods' per-item slot-memory keys are ignored when deciding whether an item matches the save. Disable only to restore the old behaviour.
# Setting type: Boolean
# Default value: true
PassthroughCompatModCustomData = true

## Comma separated key prefixes in a character's known texts that are left to the mod that owns them instead of being tracked and enforced. Valheim's known texts are the compendium - the runestone and lore entries a character has read - but nothing namespaces the keys, so some mods keep per-player progression there. EpicMMO is the shipped case: its level, experience and attribute points are one entry each, all prefixed EpicMMOSystem. Progression is only captured on full saves, never on deltas, so enforcing such a key against the server's copy would roll back everything earned since the last one. A matched key is never stored in a server save and never overwrites the live player's own value. Matching is by prefix and case sensitive. Leave this empty to track known texts in full, and note that it does not exempt anything from NewCharacterClearKnownTexts.
# Setting type: String
# Default value: EpicMMOSystem
KnownTextPassthroughPrefixes = EpicMMOSystem

## Only does anything when EpicMMO is installed, and only for a character joining this server for the first time under NewCharacterClearKnownTexts. EpicMMO does not read its level out of the known texts when something asks for it - it reads them once in a Game.SpawnPlayer patch and publishes what it found to the player's ZDO and custom data, which is where its own monster scaling reads a player's level from. That patch runs before the enforcer's join validation, so the reset left the character at level 1 while the world went on scaling monsters to the level they walked in with for the rest of the session. With this on, the reset is done ahead of every spawn patch when the server has already confirmed the character is new, so EpicMMO reads the reset state itself; when the join had to wait for that answer and there was nothing left to get in front of, EpicMMO is asked to read again afterwards instead. Turn it off to leave EpicMMO entirely alone, at the cost of the stale level above. Nothing here changes what is reset - only when, and who is told about it.
# Setting type: Boolean
# Default value: true
EpicMMOKnownTextCompat = true

## Comma separated prefab names a brand new character is allowed to arrive holding when NewCharactersRemoveExtraItems is enabled. Anything else in their inventory on their first join is confiscated, as is any item above quality 1. Names are matched exactly (case insensitively), not as substrings, so 'Torch' does not also permit 'TorchMist'. Change this if your modpack starts players with different gear; leave it empty to allow no starting items at all.
# Setting type: String
# Default value: ArmorRagsChest,ArmorRagsLegs,Torch
NewCharacterStartingItems = ArmorRagsChest,ArmorRagsLegs,Torch

## Controls what happens to an inventory item whose ItemDrop prefab does not resolve on the client - usually a modded item, or an entry another mod created directly. These cannot be tracked, matched or handed back, so by default they are left alone and logged. Enable to confiscate them instead; note that a confiscated item with no prefab name can never be returned with the confiscation commands.
# Setting type: Boolean
# Default value: false
ConfiscateUnidentifiableItems = false

## How long a joining client waits for the server's answer about its stored character before giving up and treating the character as new. The answer normally arrives during the connection handshake, well before the world finishes loading, so this only matters if that is delayed. Set to 0 to never wait. Either way the character is treated as NEW when no answer arrives - the local save file on the joining machine is never used as the baseline for a server.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 60
InitialCharacterSyncWaitSeconds = 10

## If enabled, custom data on items will be validated.
# Setting type: Boolean
# Default value: true
ValidateItemCustomData = true

## If enabled, item durability will be validated
# Setting type: Boolean
# Default value: true
ValidateItemDurability = true

## Allowed variance for item durability validation.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
ItemValidationDurabilityAllowedVariance = 10

## Whether or not to save active character effects on logout and reapply on login
# Setting type: Boolean
# Default value: true
SavePlayerStatusEffectsOnLogout = true

## Leniency for dirty reconnects (crash/timeout, where the server save may be up to one delta window stale). RemoveNontrackedItemsFromJoiningPlayers always runs otherwise; if this is enabled, untracked items are NOT confiscated when the player's last disconnect was dirty, so crash victims keep items gained in the unsaved window.
# Setting type: Boolean
# Default value: false
ItemRemovalForDirtyReconnection = false

## Leniency for dirty reconnects. AddMissingItemsFromPlayerServerSave always restores missing tracked items on a clean join, and RestoreSkillsFromPlayerServerSave raises lowered skills the same way; on a dirty reconnect both are skipped by default (to avoid duping items consumed, or handing back skill lost to a death, in the unsaved window) unless this is enabled.
# Setting type: Boolean
# Default value: false
ItemReturnForDirtyReconnection = false

## If enabled, the server re-applies the join rules (item confiscation, skill clamping, custom-data, Forsaken Power and food reset) to the first full character save a RETURNING player uploads each session, instead of trusting the client to have done it. This is the returning-character counterpart to the first-save enforcement the server already runs for brand new characters: the client runs the same checks, but the client is what you are defending against, so this is the copy a modified client cannot skip. Honours RemoveNontrackedItemsFromJoiningPlayers, PreventExternalSkillRaises, PreventExternalCustomDataChanges, PreventExternalForsakenPowerChanges, PreventExternalFoodChanges and the dirty-reconnect leniency settings, so turning those off turns off the matching server-side check too. Inert if none of them are on.
# Setting type: Boolean
# Default value: true
ServerSideJoinEnforcement = true

## For switching this mod back on after the server has run without it for a while. The characters it already holds a save for still count as returning players, but those saves stopped being updated when the mod was turned off, so a normal join would enforce the stale copy - confiscating what a player gained in the meantime, lowering their skills and putting back their old progression, Forsaken Power, food, custom data and map. While this is enabled, a returning character is instead adopted exactly as the joining client holds it, and the stored save is replaced by it on that join; nothing is confiscated, lowered or restored, on the client or by ServerSideJoinEnforcement. The confiscated item and skill reduction records are kept, a pending admin skill restore still lands, and a character the server has no save for is still held to the new-character rules. Enforcement against returning players is effectively suspended while this is on, so turn it off again once everyone has rejoined. The replaced saves are not kept - enable EnableSaveArchives first if you want a copy of them. Off by default.
# Setting type: Boolean
# Default value: false
CatchupOverwriteOnJoin = false

## If enabled, each character's save records the Forsaken Power they have selected, and it is put back when they join - so a power picked up in a solo world or on another server, one this server may never have unlocked at its boss stones, cannot be brought in. Selecting a power at a boss stone while playing here is saved as normal. A character whose save was written before this was enabled has no power recorded yet: they keep the one they arrive with on their next join and are tracked from then on, so switching this on strips nobody. Also checked server side when ServerSideJoinEnforcement is on. Pair with NewCharacterClearForsakenPower, which covers a character's first join. Off by default.
# Setting type: Boolean
# Default value: false
PreventExternalForsakenPowerChanges = false

## If enabled, a character joining this server for the first time has their Forsaken Power cleared, so one selected in a solo world or on another server does not come with them. They can select one at a boss stone here as normal. Pair with PreventExternalForsakenPowerChanges, which stops a returning character bringing a different one in later. Off by default.
# Setting type: Boolean
# Default value: false
NewCharacterClearForsakenPower = false

## If enabled, a character joining this server for the first time has their map of this world wiped: explored areas, anything a cartography table revealed, and their saved pins. Valheim keeps a separate map for every world, so arriving with this one already uncovered means having played a copy of this world somewhere else - or being a character whose save an admin deleted to reset them, who now gets a fresh map along with everything else. The wipe only happens once the server has confirmed it holds no save for the character; if that answer has not arrived by the time the join is validated the map is left alone, because unlike an item a wiped map cannot be given back. The map lives only in the player's own character file and never reaches the server, so this is carried out by the client and cannot be checked server side. Off by default.
# Setting type: Boolean
# Default value: false
NewCharacterResetMapExploration = false

## If enabled, each character's save records the foods they have eaten and how long each has left, and those exact foods are put back when they join. Vanilla keeps eaten food in the player's own character file, so without this a player can log off, eat food this server has not reached yet in a solo world, and come straight back with it - or just top their food back up for free. A returning character gets back what they left with, whatever they ate or let run out in between; a character joining for the first time has all their food cleared, and can eat as normal once here. A character whose save was written before this was enabled has no foods recorded yet: they keep what they arrive with on their next join and are tracked from then on, so switching this on strips nobody. The record is only as fresh as the character's last save, so after a crash or dropped connection a player can get back the burn time used since then - at most FullSyncPullIntervalMinutes' worth. Also checked server side when ServerSideJoinEnforcement is on. Off by default.
# Setting type: Boolean
# Default value: false
PreventExternalFoodChanges = false

## Master switch for storing a character's map, known recipes, trophies, statistics and spawn point on the server the way their items and skills already are. Everything in this group lives in the player's own character file, which means a player can edit it offline and a corrupted local save loses it for good; with this on the server keeps its own copy, hands it back on join, and its copy is the one that counts. Nothing is stored until at least one of the Sync* settings below is also on, and no extra data crosses the wire or reaches the disk while this is off. Note what this cannot do: the server can restore a statistic and refuse a value higher than the one it holds, but it has no way to prove any individual increment was earned honestly, so treat the statistics as progress that survives a lost save rather than as a cheat-proof record. Steam and Xbox achievement unlocks are held by the platform, not in the save, and are not touched at all. Off by default; every part of the feature is inert until this is on.
# Setting type: Boolean
# Default value: false
EnableProgressionSync = false

## If enabled, the server stores each character's map of this world - explored ground, what a cartography table revealed, and their saved pins - and pushes its copy back when they join. A map uncovered in a copy of this world elsewhere is replaced by what this server has seen, and a player whose local character file is lost gets their exploration back. The map is stored beside the character save as an opaque .map file rather than inside it, because a fully explored map is 8.4 megabytes before compression; a real one costs tens of kilobytes to a megabyte of disk per character per world. The client only rebuilds and uploads it when something has actually been explored since the last upload, at most once every MapSyncIntervalMinutes and once more at logout, because building it is not free on the player's machine. Requires EnableProgressionSync. Not stored in InternalStorageMode - a megabyte of opaque bytes per character does not belong in the world file - so the two together leave the map untracked and say so in the log. Off by default.
# Setting type: Boolean
# Default value: false
SyncMapExploration = false

## If enabled, the server stores what each character knows - recipes, build pieces, materials, crafting stations, discovered biomes, runestone texts and permanent unlocks - and restores its copy on join. This is the opposite end of NewCharacterClearKnownRecipes: instead of wiping what a character arrived knowing because there is nothing to check it against, the server now has something to check it against, and anything learned somewhere it did not see is replaced. Vanilla rediscovers a recipe the moment the player holds its materials and has seen its crafting station, so the materials and stations are what is really being held and the recipe list is rebuilt from them on arrival. Requires EnableProgressionSync. Off by default.
# Setting type: Boolean
# Default value: false
SyncKnownItems = false

## If enabled, the server stores the trophy list vanilla keeps in each character file - every trophy that character has ever picked up, which is what the compendium reads - and restores it on join. Kept separate from SyncKnownItems because vanilla files trophies by prefab name while everything else is a localization token, and because an admin may reasonably want one without the other. Requires EnableProgressionSync. Off by default.
# Setting type: Boolean
# Default value: false
SyncTrophies = false

## If enabled, the server stores each character's statistics - the counters behind the in-game Statistics panel and the post-1.0 achievement system: kills, deaths, distance travelled, items crafted, pieces placed and the rest - and restores them on join. A counter the client reports above the value the server holds was raised somewhere this server did not see, and is put back, the same way PreventExternalSkillRaises handles skills. Be clear about the limit: the server can hold a ceiling and restore a lost save, but it cannot verify that any single increment was honest. Achievement unlocks themselves are held by Steam or Xbox rather than in the save and are not affected. Requires EnableProgressionSync. Off by default.
# Setting type: Boolean
# Default value: false
SyncPlayerStats = false

## If enabled, the server stores where each character respawns on this world - the bed they have claimed, and the point the game falls back to when that bed is gone - and restores it on join, so a lost or corrupted local character file no longer means waking up at the start stone with a base on the other side of the map. Only the spawn point is stored; where a character logged out and where they died are deliberately not, because putting a player back at a stale logout point would relocate somebody who has since walked away. Requires EnableProgressionSync. Off by default.
# Setting type: Boolean
# Default value: false
SyncSpawnPoint = false

## If enabled, a character joining this server for the first time starts with their statistics at zero rather than carrying in the totals from wherever they were played before. The same reasoning as NewCharacterSetSkillsToZero, and worth knowing before turning it on: these counters are per character and not per world, so this discards a record of everything that character has ever done anywhere, and it cannot be undone. Only used when SyncPlayerStats is on. Off by default.
# Setting type: Boolean
# Default value: false
NewCharacterClearPlayerStats = false

## Master switch for starter loadouts: a kit of items, skill levels, known materials and a spawn point handed to a character joining this server for the first time. The kits themselves are written in Loadouts.yaml beside this file, and DefaultStarterLoadout says which one new characters get. A loadout is granted AFTER the new-character rules have stripped whatever the character arrived with, so its items do not also need listing in NewCharacterStartingItems, and it may hand over an upgraded item even though the allowlist refuses one that turns up on its own. Skills are only ever raised, never lowered. Off by default.
# Setting type: Boolean
# Default value: false
EnableStarterLoadouts = false

## The name of the loadout in Loadouts.yaml that a character joining for the first time gets. Empty means none, which leaves the feature doing nothing even with EnableStarterLoadouts on. A name that is not in the file is reported in the log and treated as none, rather than as a reason to refuse the join.
# Setting type: String
# Default value: 
DefaultStarterLoadout = 

## If enabled (the default), every time this mod lowers a character's skill - a returning character clamped back to the level the server holds for them under PreventExternalSkillRaises, or a first-time character's skills set to zero under NewCharacterSetSkillsToZero - the skill, the level it was lowered from and to, when, and why are written into that character's save, and enforcer-skills-list shows them. That record is what lets an admin undo one: enforcer-skills-restore puts each skill back to the highest level it was recorded being lowered from, straight away if the player is online and on their next join if not, and enforcer-skills-clear forgets a record without restoring anything. Only reductions this mod makes are recorded - the skill loss on death is the game's own, and a reported value the game could never produce (above 100, negative) is corrected without a record because there is nothing valid to put it back to. Turn this off to stop recording; records already made are kept until they are restored or cleared.
# Setting type: Boolean
# Default value: true
RecordSkillReductions = true

## If enabled, a character joining this server for the first time forgets every recipe and build piece they discovered somewhere else. Valheim discovers a recipe as soon as the player knows its materials and crafting station, so the materials, crafting stations and trophies they know are cleared too - the same reset as the game's resetknownitems command - and discovery starts again from what they are carrying once the other new-character rules have run. Like NewCharacterResetMapExploration this only happens once the server has confirmed it holds no save for the character, because forgotten recipes cannot be given back, and it is carried out by the client because recipes never reach the server. Never applies in singleplayer or to a listen host's own character. Note that on a server which already has players, anyone joining for the first time since Valheim Enforcer was installed has no save yet and counts as new. On by default.
# Setting type: Boolean
# Default value: true
NewCharacterClearKnownRecipes = true

## If enabled, a character joining this server for the first time forgets its known texts - the runestone and lore entries of the in-game compendium, read somewhere this server never saw. Vanilla's own reset does not cover these: Player.ResetCharacterKnownItems, which NewCharacterClearKnownRecipes runs, clears recipes, materials, crafting stations and trophies and leaves known texts untouched. That matters beyond the compendium, because some mods keep per-player progression in the same dictionary - EpicMMO stores a character's level, experience and attribute points there, one entry each - so with this off a first-time joiner whose items, skills, recipes and custom data were all reset still arrives at the level they reached elsewhere. KnownTextPassthroughPrefixes does not exempt anything from this; it governs what is enforced between joins, not what a character may bring in on its first one. Like the recipe and map resets this cannot be undone, so it only happens once the server has confirmed it holds no save for the character, and it is carried out by the client because known texts never reach the server. Never applies in singleplayer or to a listen host's own character. On by default.
# Setting type: Boolean
# Default value: true
NewCharacterClearKnownTexts = true

## Master switch for the one-character-per-account rule. When enabled, an account may only join with a character the server already has a save for, up to MaxCharactersPerAccount; any other character is refused at the connect handshake and told which character to use instead. Characters that already have a save are always allowed, so turning this on never locks out an existing player - it only stops new characters being added. Freeing a slot means deleting that character's save file (BepInEx/config/ValheimEnforcer/Characters/<accountId>/<Name>.yaml), which is what a character reset already involves. Off by default.
# Setting type: Boolean
# Default value: false
EnforceCharacterLimit = false

## How many characters one account may have on this server when EnforceCharacterLimit is enabled. Accounts that already have more than this keep every character they have; the limit only blocks adding another.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 20
MaxCharactersPerAccount = 1

## Comma-separated list of account ids allowed to connect with any number of characters, regardless of EnforceCharacterLimit. Independent of admin status - an id listed here does not need to be an admin, and an admin is not exempt unless listed (or CharacterLimitExemptAdmins is enabled). Both the platform-prefixed form (Steam_76561198012345678) and the bare id (76561198012345678) are accepted. Note this setting is synced to connected clients, so the ids in it are visible to players.
# Setting type: String
# Default value: 
CharacterLimitExemptAccounts = 

## If enabled, anyone on the server's adminlist is exempt from the character limit without needing an entry in CharacterLimitExemptAccounts. Off by default so the two permissions stay separate.
# Setting type: Boolean
# Default value: false
CharacterLimitExemptAdmins = false

[World Integrity]

## Master switch for server-side validation of the structures clients place. When enabled, the server inspects the objects arriving from each client and reports the ones no legitimate client can produce: geometry that is not in any build menu, and pieces whose health is above what the prefab was designed to hold. This is the check for somebody spawning dungeon rooms, dvergr towns and ruins into a world - the structures that show a nameplate with no crafter on it, cannot be destroyed, and flatten the ground where they land. Off by default; every part of the feature is inert until this is on.
# Setting type: Boolean
# Default value: false
EnableStructureValidation = false

## Flag a client that creates a structure which is in no build menu. Membership of a piece table is what makes a prefab placeable at all - by the hammer, the hoe, the cultivator, and by every blueprint or bulk-building mod, which all place out of those same tables - so a mod's own pieces are covered automatically and a large blueprint cannot trip this.
# Setting type: Boolean
# Default value: true
DetectNonBuildableStructures = true

## Block ZNetScene's SpawnObject RPC, an unused routed call that nothing in the game legitimately sends but which lets any client have the server instantiate any prefab by hash - creatures and items, not just structures. When on (the default), every client-originated SpawnObject is refused, reported to the moderation Discord channel (the structureFlagged notification, controlled by Discord.NotifyStructureFlagged) and follows StructureValidationAction for what happens to the player - which defaults to Log, so the default is 'block it and post to Discord' without kicking or banning. A structure spawned this way is reported as a structure detection either way. The call is refused before the server relays it, so no other client receives it either. Works on its own; EnableStructureValidation is not required. Calls the server makes itself are never blocked, and admins are exempt while StructureValidationExemptAdmins is on. Turn this off in case a mod on your server legitimately has clients send this RPC; non-buildable structures sent through it are still refused while structure validation is on.
# Setting type: Boolean
# Default value: true
BlockSpawnObjectRPC = true

## Flag a client that writes a piece's health above the maximum its prefab allows, which is how an indestructible structure is actually made - there is no separate invulnerability flag in Valheim, just an absurd number in the health field. The ceiling accounts for world modifiers that raise building health, and repairing a piece to full is never flagged. Health that was already too high before the client touched it is attributed to nobody, so walking past a cheated structure cannot get an innocent player reported; use Enforcer-Scan-Structures to find those. This is the one check that needs a hook on every ZDO the server deserializes - it compares against the health the object held before the client's write, which no longer exists once the packet is done - so the hook is only installed when this and EnableStructureValidation are both on at startup, and turning either on in a running server takes a restart before this check begins working. The other checks, and the server-side death handling under ServerSideJoinEnforcement, are unaffected either way.
# Setting type: Boolean
# Default value: true
DetectExcessiveStructureHealth = true

## Headroom on the health ceiling, for servers running a mod that raises piece health at runtime rather than on the prefab (a building-strength skill, for example). 1 means the prefab's own maximum, which is correct for vanilla and for mods that edit the prefab. Raise it only if legitimate pieces are being flagged, and prefer IgnoredStructurePrefabs if only a few prefabs are affected.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 1000
StructureHealthAllowedMultiplier = 1

## Server-side action taken against a player caught placing invalid structures. Detections are always written to the server log and posted to Discord regardless of this setting; this only controls what happens to the player. Defaults to Log so a server can watch the detector for a while before letting it remove anybody.
# Setting type: String
# Default value: Log
# Acceptable values: Log, Kick, Ban
StructureValidationAction = Log

## Destroy a flagged structure instead of only reporting it. Deliberately separate from the action above, and off by default, because a false positive here deletes something rather than merely naming it - run with this off first and read the log. Note this removes the structure, not the terrain flattening that came with it; that arrives as separate objects and still needs re-terraforming by hand.
# Setting type: Boolean
# Default value: false
RemoveDetectedStructures = false

## Whether anyone on the server's adminlist is exempt from structure validation. On by default, unlike the other admin exemptions in this mod: spawning a non-buildable prefab is an ordinary thing to do with devcommands, and an admin building with them should not have to notice this feature exists. Turn it off to hold admins to the same rules as everyone else.
# Setting type: Boolean
# Default value: true
StructureValidationExemptAdmins = true

## Master switch for checking where a player's new equipment came from. A crafted item records who made it; an item conjured with devcommands or a mod menu records nobody, because only the crafting path ever writes that field. Note that having no crafter is perfectly normal on its own - every loot drop, chest item and trader purchase in the game has none - so the server works out from the loaded prefabs which equipment has no uncrafted route at all, and only reports that. Only items that have just appeared are examined, never whole inventories, so gear a character already had is never re-examined and no migration is needed. This warns and never confiscates. Off by default; every part of the feature is inert until this is on.
# Setting type: Boolean
# Default value: false
DetectItemOrigins = false

## Report equipment that appears with no crafter recorded and that nothing in this world drops, sells or spawns. The list of things obtainable without crafting is read from the loaded prefabs - drop tables, creature drops, pickables and trader stock - so a modded boss with a custom weapon drop is covered without anyone listing it. Requires DetectItemOrigins.
# Setting type: Boolean
# Default value: true
DetectUncraftedEquipment = true

## Report equipment whose crafter is a player id nobody on this server has ever reported. Somebody who spawns gear and then stamps a crafter on it has to invent a number, and an invented one belongs to no player here. Trading is unaffected: the question is whether the id is known, not whether it is yours, so a sword one player made and gave to another is fine. Ids are collected from connected players and kept in PlayerIds.yaml. Expect some noise at first - an item crafted by somebody who has not joined since you enabled this has a crafter the registry does not know yet - and note that nothing is reported at all until the registry has somebody in it. Requires DetectItemOrigins.
# Setting type: Boolean
# Default value: true
DetectUnknownCrafterIds = true

## Whether admins are exempt from item origin checks. On by default, matching StructureValidationExemptAdmins: spawning items is an ordinary thing to do with devcommands and an admin should not have to notice this feature exists.
# Setting type: Boolean
# Default value: true
ItemOriginExemptAdmins = true

## Comma-separated allowlist of item prefab names never reported, matched as a case-insensitive substring so one entry can cover a family. Applied before every other check. This is the escape hatch for a mod that hands out gear by a route the prefab scan cannot see - a quest reward written in code, an item granted by a script - and it is the thing to reach for rather than turning the feature off.
# Setting type: String
# Default value: 
IgnoredItemOriginPrefabs = 

## Report items sitting in an inventory cell that inventory does not have. Every item records the grid cell it occupies, so an item in column 11 of an eight-column inventory is not suspicious, it is impossible - the only way to produce one is to have resized the grid, which is a feature of the injected cheat menus and of nothing else. Only items that have just appeared are examined, never whole inventories, so nothing a character already had is re-examined and no migration is needed. This warns; it never confiscates. What it also does is record a contradiction against the connection, so it counts toward ContradictionThreshold alongside the network guards - see enforcer-trust.
# Setting type: Boolean
# Default value: true
DetectInventoryGrid = true

## Whether admins are exempt from the inventory grid check. On by default, matching ItemOriginExemptAdmins.
# Setting type: Boolean
# Default value: true
InventoryGridExemptAdmins = true

## Columns a player inventory may legitimately have. 8 is correct for vanilla and for every inventory mod in wide use: vanilla builds the player inventory eight columns wide and offers no way to change that - Player.SetInventorySize takes ROWS only - and ExtraSlots, AzuExtendedPlayerInventory and EquipmentAndQuickSlots all add rows and leave the width alone. Raise it only if a mod on your server genuinely widens the grid; 0 disables the column check. Requires DetectInventoryGrid.
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 0 to 64
MaxInventoryWidth = 8

## Rows a player inventory may legitimately have, or 0 to not check rows at all. Off by default because, unlike the width, there is no answer that is right for everybody: vanilla itself sells rows at the trader up to nine, and ExtraSlots, AzuExtendedPlayerInventory and EquipmentAndQuickSlots each add more on top, some of them hidden. Set this only if you know what your own mod set produces - count the rows on a fully equipped player and add a margin - and watch the log before trusting it. A vanilla server can use 9. Requires DetectInventoryGrid.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 64
MaxInventoryHeight = 0

## Comma-separated allowlist of prefab names never flagged, matched as a case-insensitive substring so one entry can cover a family of prefabs (e.g. 'dvergrprops_' covers all of them). Applied last, so it overrides every check above. This is the escape hatch when a mod on your server legitimately creates an object this detector does not recognise - reach for it rather than turning the whole feature off, and reach for it before enabling RemoveDetectedStructures.
# Setting type: String
# Default value: 
IgnoredStructurePrefabs = 

