[Advanced]

## If enabled (the default), the two commands that tell somebody nothing but what they could already work out - 'enforcer-help', which lists the command names, and 'enforcer-whoami', which reports what this server makes of the connection the caller is sitting on - run for any player rather than admins only. This exists because the person who most needs to ask 'why am I not an admin here?' is by definition the person the admin check is refusing, and with the answer locked behind that same check an operator whose id is misspelled in adminlist.txt has no way to find out from in-game. Neither command reads or changes anything belonging to the server or to another player, and enforcer-whoami never names another admin. Turn it off if you would rather players could not see the command list at all; every other command stays admin-only regardless.
# Setting type: Boolean
# Default value: true
AllowPublicDiagnosticCommands = true

## How often, in minutes, a client may upload its map. Building the upload means rebuilding and compressing an 8.4 megabyte package on the player's own machine, so this is deliberately coarse; the client also skips the upload entirely when nothing has been explored since the last one, and sends once more at logout regardless. Only used when SyncMapExploration is on.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 1 to 240
MapSyncIntervalMinutes = 15

## If enabled, player character data will be stored within your world. Enables full portability of the world without having to synchronize configurations.
# Setting type: Boolean
# Default value: false
InternalStorageMode = false

## How long (in milliseconds) one of this mod's operations may take before it is reported as a frame hitch in the log. Covers the periodic cheat scans, the character delta flush and character saves. Purely diagnostic - it changes nothing about what the mod does, it only decides when a slow operation is worth a warning. Lower it while chasing a stutter report; raise it, or set 0 to disable the warning entirely, if a slow disk makes it noisy.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 0 to 10000
StallWarningThresholdMs = 100

## How frequently (in seconds) the mod polls config files on disk for changes.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 300
ConfigPollIntervalSeconds = 30

## Minimum time (in seconds) between incremental inventory/skill/custom-data updates. Updates are only produced when the player's inventory actually changes, so an idle player sends nothing; this is a rate limit rather than a polling interval.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 5 to 300
CharacterDeltaTracker = 15

## How often (in minutes) the server asks connected players to upload a full character save. Full saves are a periodic reconciliation layered on top of the incremental delta updates (CharacterDeltaTracker); they are no longer tied to the world/profile autosave.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 1 to 1440
FullSyncPullIntervalMinutes = 25

## Maximum time spent hashing local plugin DLLs at startup before giving up and reporting the remainder as unverifiable. Hashing runs on background threads and usually takes well under a second; this is a safety valve for a stalled disk, not a tuning knob.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 300
HashComputeTimeoutSeconds = 30

## Largest Thunderstore archive, in megabytes, the server will download when resolving mod hashes. Archives are held in memory while their DLLs are hashed, so this is also the peak transient allocation; packages are resolved one at a time so it is never multiplied. Larger archives are skipped and logged.
# Setting type: Int32
# Default value: 128
# Acceptable value range: From 1 to 512
ThunderstoreMaxArchiveMB = 128

## Maximum number of players the server asks to upload a full character save at the same time. Larger player counts are staggered into successive waves of this size to avoid a bandwidth spike. 10 is safe on a healthy server; lower it on constrained upload/VPS hosts.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 50
FullSyncMaxConcurrentPlayers = 5

## If enabled (the default), the server verifies the sender id on every routed network message against the connection it actually arrived on, and corrects it if they disagree. Valheim's routed RPC carries a sender id that the sending client writes and the server never checks, so without this a modified client can impersonate any other connected player - running admin commands, getting someone else banned, or overwriting another player's character save. This affects only forged packets; an honest client is never touched. Leave it on unless another mod is misbehaving because of it, in which case report the mod - turning this off re-opens sender spoofing for this mod AND every other routed RPC on the server.
# Setting type: Boolean
# Default value: true
EnforceRoutedRpcSender = true

## How long, in minutes, the server keeps a character's save in memory after that character was last touched - a save, an incremental update, a death record, or a login. Saves on disk are always the authority, so an entry dropped from memory costs one file read the next time that player's data changes; this exists so a busy server's memory reflects who is playing now rather than everyone who has joined since the last restart. Keep it above FullSyncPullIntervalMinutes so players who are online but idle are not reloaded after every periodic pull. 0 keeps every character in memory until restart, which is what earlier versions did. Not used with InternalStorageMode.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 0 to 1440
CharacterCacheIdleMinutes = 30

## When above 0, writes the summary enforcer-memory prints to the server log every this-many minutes: process working set, managed heap, what this mod is holding (cached characters, audit buffers, per-player tables) and the world's object counts. Purely diagnostic. Off by default.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 1440
MemoryReportIntervalMinutes = 0

## When above 0, a character changed by an incremental update is written to disk at most once every this-many seconds, instead of after every update. The copy in memory is what the server works from either way, so nothing a connected player does is affected; what changes is how far the FILE can trail it. Full saves, deaths, a player leaving, a player joining and a server shutdown all still write straight away, so this only ever delays the routine updates in between. The cost is the obvious one: a server that dies without shutting down loses up to this many seconds of those updates for whoever was mid-session, on top of the rate limit they already ride (CharacterDeltaTracker). Worth turning on for a busy server, where rewriting a whole character for every player every few seconds is the largest single source of memory churn this mod has; 30 to 60 is a sensible value. 0, the default, writes after every update as earlier versions did. Not used with InternalStorageMode.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 600
CharacterWriteIntervalSeconds = 0

## If enabled (the default), the periodic full character saves are asked for one player at a time, evenly spaced across FullSyncPullIntervalMinutes, rather than from everybody at once in waves at the end of it. Each player is still asked exactly as often. The difference is to the server: a full save is the most expensive thing a player sends, and a hundred of them inside a minute is a burst of work and memory every interval where one every few seconds is nothing at all. Turn it off to go back to waves of FullSyncMaxConcurrentPlayers, which that setting then controls again.
# Setting type: Boolean
# Default value: true
FullSyncSpreadAcrossInterval = true

## If enabled (the default), character saves are written by a purpose-built writer instead of the general YAML serializer. The file is the same file - same keys, same layout, read back by the same reader, and interchangeable with saves written the other way - but producing it costs a small fraction of the memory, which matters because a character is rewritten every time a player's inventory changes. The writer checks itself against the serializer once at startup and hands everything back to the serializer for the session if the two disagree about anything, saying so in the log. Turn this off only if you suspect it of a problem; saves keep working exactly as they did before it existed.
# Setting type: Boolean
# Default value: true
FastCharacterWriter = true

## If enabled (the default), character saves are written to disk on a background thread. The game takes a quick copy of the character and carries on, and the file is written a moment later - the same file, published the same way. Before this, every save this machine made for itself was written in the middle of a frame: on a client that is the join, every death and every respawn, each a visible stutter with a large character. Saves of the same character that pile up are written once, anything that reads a character back waits for its pending write first, and logging out, a server shutting down and quitting all wait for every pending write before going on. Saves clients send to a server were already written in the background and still are, regardless of this setting. Turn this off only if you suspect it of a problem; saves are then written on the spot, exactly as before. The in-world copy InternalStorageMode keeps is written on the spot either way, because the world's data can only be changed from the game's main thread.
# Setting type: Boolean
# Default value: true
BackgroundCharacterWrites = true

## If enabled (the default), the server tells connecting clients it accepts incremental character updates in a compact binary form, and clients that understand that send it instead of YAML. Same content either way; the binary form costs the server a few kilobytes to read where the YAML one cost around a hundred and fifty, once per player every few seconds, on the main thread. Clients running a build from before this existed keep sending YAML and are handled as they always were, and turning this off makes every client do the same from its next connection.
# Setting type: Boolean
# Default value: true
BinaryDeltaUpdates = true

## If enabled (the default), a player's custom data is recorded at the save the game takes just before every respawn, so what other mods wrote there survives the respawn. Many mods only write their player data into the character at the moment the game saves it - Travel Totems keeps its unlocked totems that way, EpicLoot its bounties and adventure progress - and the game's own save before a respawn is one this mod never used to see. The respawn then put back the copy this mod last recorded, which could be up to half an hour old, and the other mod read that back in: totems unlocked since were forgotten on every death. Only used with PreventExternalCustomDataChanges, and only after a player's join has been checked, so what a character arrives with is enforced exactly as before. Turn this off to go back to the old behaviour.
# Setting type: Boolean
# Default value: true
CaptureCustomDataOnRespawn = true

[Anti-Cheat]

## Master switch for client-side cheat scanning. When enabled the client checks running processes, the DLLs loaded into the game, and open window titles against a catalog of known cheat tools. Only matched entries are reported to the server - the player's full process list is never transmitted.
# Setting type: Boolean
# Default value: true
EnableCheatDetection = true

## Detect injected cheat menus by the namespace of the types they load into the game, including assemblies that arrive mid-session. This is the vector that sees a cheat which is not a BepInEx plugin: it has no file in BepInEx/plugins to hash, it is not in the mod list the client declares at join, and a menu that draws inside the game has neither a process nor a window to find it by - but its own types are loaded in this process, and their namespace survives renaming the file. Currently covers ValheimTooler and Valheaven (a.k.a. ValheimAdminMenu). Both are auto-banned on a confirmed detection regardless of ActionOnDetection. High confidence, very low cost: an assembly is inspected once and the result cached for the session.
# Setting type: Boolean
# Default value: true
DetectInjectedCheatAssemblies = true

## Include ValheimTooler in the injected-assembly scan. Split out from the rest because it predates the catalog and servers may already have turned it off. Requires DetectInjectedCheatAssemblies.
# Setting type: Boolean
# Default value: true
DetectValheimTooler = true

## Detect proxy-DLL loaders: a copy of a Windows system DLL sitting beside valheim.exe instead of in System32. Windows resolves a DLL from the game folder first, so dropping one there gets it loaded into the game ahead of the real one, which then does as it likes and forwards the genuine exports on. This is how Valheaven ships (as version.dll) and it is the standard way to load a cheat that is not a mod. The check is not the name - every name involved is a real Windows DLL the game legitimately loads - it is where the file was loaded FROM, so it survives renaming and rebuilding. Every flagged file is hashed, and the hash decides first: a build known to be a cheat is reported under that tool's own name and cannot be allowlisted away. BepInEx's own doorstop is a winhttp.dll proxy and is recognised as such. The graphics names (dxgi, d3d9/10/11/12, ddraw, opengl32) are reported as low confidence and never enforced on their own, because ReShade, Special K and ENB all install exactly this way. Everything else is an injector nobody has identified and follows ActionOnDetection, legitimate ones included - nothing is trusted here that an admin has not vouched for. If you recognise one, put its hash in AllowedProxyLoaderHashes rather than its name in IgnoredCheatProcesses. Requires ScanLoadedModules.
# Setting type: Boolean
# Default value: true
DetectProxyLoaders = true

## Scan for the built-in catalog of known cheat tools: WeMod/Wand, ArtMoney, PLITCH, Speed Gear, Squalr, WPE Pro, and the injectors/loaders used to deliver Valheim cheats (SharpMonoInjector, Xenos, Extreme Injector, ValheimTooler launcher, ValHack, Valheim Mod Menu). Tools with no legitimate purpose are auto-banned; the rest follow ActionOnDetection.
# Setting type: Boolean
# Default value: true
DetectCheatTools = true

## Include Cheat Engine in the catalog scan (process names, window titles, and injected speedhack/DBK modules). Its TfrmMain/TfrmMemView window classes are generic Delphi names shared by legitimate software, so a class-only sighting is logged but never kicked or banned. Note: Cheat Engine has legitimate uses — prefer Log action over Kick/Ban. Requires DetectCheatTools.
# Setting type: Boolean
# Default value: true
DetectCheatEngine = true

