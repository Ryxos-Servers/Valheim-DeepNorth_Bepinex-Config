## Comma-separated allowlist of process, module or window names to never flag, matched as a case-insensitive substring. Applied last, so it overrides the built-in catalog and AdditionalCheatProcesses. Use this to keep playing when a legitimate program trips a signature. An entry containing a path separator ('\' or '/') is also matched against the folder a proxy DLL was loaded from, so a whole directory can be exempted - entries without one keep matching names only, so an existing entry like 'steam' cannot become an exemption for the entire game folder. One thing this no longer overrides: a proxy DLL whose build is known to be a cheat is matched before any allowlist, and DetectProxyLoaders is the only way past that.
# Setting type: String
# Default value: 
IgnoredCheatProcesses = 

## Comma-separated SHA256 hashes of proxy DLLs to treat as legitimate, matched against the hash of the file itself, case-insensitively. Empty by default, and this is the right escape hatch to reach for when DetectProxyLoaders flags something it should not. A proxy DLL is judged by where it was loaded from, and the game folder is also where every mod manager puts its own loader - so past the names, a legitimate loader is not distinguishable from a cheat by name or by path, and the file's own content is all that is left. The hash of the flagged file is printed in the server log line for the detection; copy it from there. Two things this deliberately does not do. It does not exempt a build known to be a cheat: those are matched first and cannot be allowlisted. And it does not exempt a name - a hash is one specific file, so the check keeps working against every other DLL that later turns up under the same name, which is the whole difference between this and putting the name in IgnoredCheatProcesses. Set it on the server; connected clients pick it up on their next module scan, but a player already kicked has to rejoin.
# Setting type: String
# Default value: 
AllowedProxyLoaderHashes = 

